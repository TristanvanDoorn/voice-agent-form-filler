<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Filler</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <form id="myForm">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="options">Options:</label>
            <select id="options" name="options">
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>
                <option value="option3">Option 3</option>
            </select>
        </div>
        <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Enter your message here" required></textarea>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
    <script src="form-filler.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('myForm'); 
            if (form) {
              form.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent actual submission for the test
                console.log('Form submission intercepted for testing. FormData:', new FormData(form));
                // alert('Form submission intercepted for testing! Check the console.');
              });
            }
        });
    </script>
</body>
</html>
